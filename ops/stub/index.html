<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYX</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0c1a2d; color: #d4e5f7;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .card {
    width: min(92vw, 420px); padding: 2.5rem 2rem; text-align: center;
    background: #132640; border: 1px solid #1e3a5f; border-radius: 14px;
  }
  .logo { color: #7dd3fc; font-size: 1.8rem; font-weight: 700; letter-spacing: .08em; }
  p { margin: .6rem 0 1.6rem; color: #93c5fd; font-size: .95rem; line-height: 1.5; }
  a {
    display: inline-block; padding: .7rem 1.8rem; border-radius: 8px;
    background: #38bdf8; color: #0c1a2d; font-weight: 600; text-decoration: none;
  }
  a:hover { background: #0ea599; }
  footer { margin-top: 1.5rem; color: #5a7fa0; font-size: .75rem; }
</style>
</head>
<body>
<main class="card">
  <div class="logo">NYX</div>
  <p>Сервис доступа.<br>Управление — после входа.</p>
  <a href="/self/login">Войти</a>
  <footer>&copy; 2026 Merlin.</footer>
</main>
</body>
</html>
