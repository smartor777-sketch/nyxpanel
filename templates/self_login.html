<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYX Panel — Login</title>
<style>
  :root { --bg: #0c1a2d; --fg: #d4e5f7; --card: #132640; --border: #1e3a5f; --input-bg: #132640; --heading: #7dd3fc; --muted: #93c5fd; --accent: #38bdf8; --accent-hover: #0ea599; --flash-err-bg: #450a0a; --flash-err-border: #dc2626; --flash-err-fg: #f87171; }
  [data-theme="light"] { --bg: #eaf2fb; --fg: #1e3a5f; --card: #ffffff; --border: #c5ddf0; --input-bg: #dceaf7; --heading: #0358a8; --muted: #5a7fa0; --accent: #0284c7; --accent-hover: #0369a1; --flash-err-bg: #fef2f2; --flash-err-border: #fca5a5; --flash-err-fg: #dc2626; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--fg); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 2.5rem; width: 360px; position: relative; }
  .theme-btn { position: absolute; top: 0.75rem; right: 0.75rem; background: none; border: 1px solid var(--border); padding: 0.2rem 0.5rem; font-size: 1rem; cursor: pointer; border-radius: 6px; color: var(--fg); }
  .theme-btn:hover { background: var(--input-bg); }
  h1 { color: var(--heading); margin-bottom: 1.5rem; text-align: center; font-size: 1.4rem; }
  form { display: flex; flex-direction: column; gap: 1rem; }
  input { padding: 0.7rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--fg); font-size: 1rem; }
  input:focus { outline: none; border-color: var(--heading); }
  button { padding: 0.7rem; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
  button:hover { background: var(--accent-hover); }
  .flash { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }
  .flash.error { background: var(--flash-err-bg); border: 1px solid var(--flash-err-border); color: var(--flash-err-fg); }
</style>
<script>
const themeKey = 'nyx_theme';
function getTheme() { return localStorage.getItem(themeKey) || 'dark'; }
function setTheme(t) { document.documentElement.setAttribute('data-theme',t); localStorage.setItem(themeKey,t); document.getElementById('themeBtn').textContent = t==='dark'?'\u{1F319}':'\u{2600}\u{FE0F}'; }
function toggleTheme() { setTheme(getTheme()==='dark'?'light':'dark'); }
setTheme(getTheme());
</script>
</head>
<body>
<div class="card">
  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
  <h1>NYX Panel <span style="font-size:0.7rem;color:var(--muted, #8b949e);font-weight:normal">v{{ version }}</span></h1>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, msg in messages %}
        <div class="flash {{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  <form method="POST">
    <input name="username" placeholder="Username" required autofocus>
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Sign In</button>
  </form>
</div>
</body>
</html>
