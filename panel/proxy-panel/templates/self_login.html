<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<title>NYX Panel — Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 2.5rem; width: 360px; position: relative; }
  .header-btns { position: absolute; top: 0.75rem; right: 0.75rem; display: flex; gap: 0.4rem; }
  .theme-btn { background: var(--btn-theme-bg); color: var(--btn-theme-fg); border: 1px solid var(--btn-theme-border); padding: 0.2rem 0.5rem; font-size: 1rem; cursor: pointer; border-radius: 6px; }
  .theme-btn:hover { filter: brightness(0.95); }
  .lang-btn { background: var(--btn-lang-bg); color: var(--btn-lang-fg); border: 1px solid var(--btn-lang-border); padding: 0.2rem 0.5rem; font-size: 0.8rem; cursor: pointer; border-radius: 6px; font-weight: 600; }
  .lang-btn:hover { filter: brightness(0.95); }
  h1 { color: var(--heading); margin-bottom: 1.5rem; text-align: center; font-size: 1.4rem; }
  form { display: flex; flex-direction: column; gap: 1rem; }
  input { padding: 0.7rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--fg); font-size: 1rem; }
  input:focus { outline: none; border-color: var(--heading); }
  input::placeholder { color: var(--muted); opacity: 0.6; }
  button[type="submit"] { padding: 0.7rem; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
  button[type="submit"]:hover { background: var(--accent-hover); }
  .flash { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }
  .flash.error { background: var(--flash-err-bg); border: 1px solid var(--flash-err-border); color: var(--flash-err-fg); }
.footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 1.5rem 0 0.5rem; border-top: 1px solid var(--border); margin-top: 2rem; }
@media (max-width: 420px) {
  .card { width: 100%; padding: 1.5rem; border-radius: 0; min-height: 100vh; justify-content: center; }
  body { padding: 0; }
}
</style>
<style id="theme-vars">
  :root {
    --bg: #0f1115; --fg: #d6dae1; --card: #161a21; --border: #2a3039;
    --input-bg: #1b2028; --heading: #e8ebf0; --muted: #9aa3b0;
    --accent: #5b9dff; --accent-hover: #4a8af0;
    --flash-err-bg: #351718; --flash-err-border: #7f2a2a; --flash-err-fg: #fca5a5;
    --btn-logout-bg: #1b2028; --btn-logout-fg: #b9c2ce; --btn-logout-border: #333a44;
    --btn-theme-bg: #1b2028; --btn-theme-fg: #b9c2ce; --btn-theme-border: #333a44;
    --btn-lang-bg: #1b2028; --btn-lang-fg: #b9c2ce; --btn-lang-border: #333a44;
  }
  :root[data-theme="light"] {
    --bg: #f4f5f7; --fg: #1f2430; --card: #ffffff; --border: #e1e4e9;
    --input-bg: #f2f3f5; --heading: #111827; --muted: #6b7280;
    --accent: #2563eb; --accent-hover: #1d4ed8;
    --flash-err-bg: #fdecec; --flash-err-border: #f3b8b8; --flash-err-fg: #b91c1c;
    --btn-logout-bg: #eef0f3; --btn-logout-fg: #4b5563; --btn-logout-border: #d6d9df;
    --btn-theme-bg: #eef0f3; --btn-theme-fg: #4b5563; --btn-theme-border: #d6d9df;
    --btn-lang-bg: #eef0f3; --btn-lang-fg: #4b5563; --btn-lang-border: #d6d9df;
  }
</style>
<script>
try { document.documentElement.setAttribute('data-theme', localStorage.getItem('nyx_theme') || 'dark'); } catch (e) {}
</script>
</head>
<body>
<div class="card">
  <div class="header-btns">
    <button class="lang-btn" id="langBtn" onclick="toggleLang()"></button>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()"></button>
  </div>
  <h1>NYX Panel <span style="font-size:0.7rem;color:var(--muted);font-weight:normal">v{{ version }}</span></h1>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, msg in messages %}
        <div class="flash {{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  <form method="POST">
    <input name="username" data-i18n-placeholder="username" placeholder="Username" required autofocus>
    <input name="password" type="password" data-i18n-placeholder="password" placeholder="Password" required>
    <button type="submit" data-i18n="signin">Sign In</button>
  </form>
  <div class="footer">
    &copy; 2026 user02.<br>
    <em>Crafting Dreams &amp; Magic</em>
  </div>
</div>
<script>
const themeKey = 'nyx_theme';
const langKey = 'nyx_lang';
function getTheme() { return localStorage.getItem(themeKey) || 'dark'; }
function setTheme(t) {
  localStorage.setItem(themeKey, t);
  document.documentElement.setAttribute('data-theme', t);
  var _m = document.querySelector('meta[name="theme-color"]');
  if (_m) _m.content = t === 'dark' ? '#0f1115' : '#f4f5f7';
  document.getElementById('themeBtn').textContent = t === 'dark' ? '\u{1F319}' : '\u{2600}\u{FE0F}';
}
function toggleTheme() { setTheme(getTheme() === 'dark' ? 'light' : 'dark'); }

const _t = {
  ru: { username: 'Имя пользователя', password: 'Пароль', signin: 'Войти' },
  en: { username: 'Username', password: 'Password', signin: 'Sign In' }
};
function getLang() { return localStorage.getItem(langKey) || 'ru'; }
function setLang(l) { localStorage.setItem(langKey, l); document.getElementById('langBtn').textContent = l === 'ru' ? 'EN' : 'RU'; applyLang(); }
function toggleLang() { setLang(getLang() === 'ru' ? 'en' : 'ru'); }
function _(k) { return _t[getLang()][k] || k; }
function applyLang() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = _(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = _(el.dataset.i18nPlaceholder); });
}

setTheme(getTheme());
setLang(getLang());
</script>
</body>
</html>
