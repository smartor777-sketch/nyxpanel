<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYX Panel — Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background: #0d1117; color: #c9d1d9; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 2.5rem; width: 360px; }
  h1 { color: #58a6ff; margin-bottom: 1.5rem; text-align: center; font-size: 1.4rem; }
  form { display: flex; flex-direction: column; gap: 1rem; }
  input { padding: 0.7rem 1rem; border-radius: 8px; border: 1px solid #30363d; background: #21262d; color: #c9d1d9; font-size: 1rem; }
  input:focus { outline: none; border-color: #58a6ff; }
  button { padding: 0.7rem; border-radius: 8px; border: none; background: #238636; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
  button:hover { background: #2ea043; }
  .flash { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }
  .flash.error { background: #3a1b1b; border: 1px solid #da3633; color: #ff7b72; }
</style>
</head>
<body>
<div class="card">
  <h1>NYX Panel</h1>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, msg in messages %}
        <div class="flash {{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  <form method="POST">
    <input name="username" placeholder="Username" required autofocus>
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Sign In</button>
  </form>
</div>
</body>
</html>
